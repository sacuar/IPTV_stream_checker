name: M3U Stream Checker source check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check source syntax
        run: python -m py_compile m3u_stream_checker.py
      - name: Check requirements and screenshot files
        run: |
          test -f requirements.txt
          test -f screenshots/scr1.jpg
